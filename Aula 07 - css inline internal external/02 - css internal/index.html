<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Internal</title>
    <!-- Aqui vai o CSS Internal -->
     <style>
        p {
            color: red;
            font-size: 18px; 
        }
        .destaque {
            background-color: 125096;
            color: white;
            padding: 10px;
            border-left: 4px solid orange;
        }
        #principal {
            border: 2px solid orange;
            padding: 20px;
            margin: 20px;
        }
        #tituloSecao{
            color: blue;
        }
     </style>
</head>
<body>
    <h1>Demonstração de CSS Internal</h1>
    <p>Este paragrafo é estilizado
        <br>através do CSS internal, definido no head
    </p>
    <p class="destaque">
        Este paragrafo possui uma classe "destaque" e recebe estilos especificos
    </p>
    <section id="principal">
        <h2 id="tituloSecao">Seção principal</h2>
        <p style="color: blue;">Esta seção possui o ID (#) "principal" é estilizado de forma única</p>
    </section>
        </body>
</html>
