<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content=""
      width="device-width,"
      initial-scale="1.0"
    />
    <title>Inserindo midias no html5</title>
  </head>
  <body>
    <h1>Incoporando midias no site</h1>

    <h2>Imagens:</h2>
    <img
      src="./midias/imagem.jpg"
      alt="Foto de paisagem"
      width="300px"
      height="300px"
    />

    <h2>Imagens com leganda:</h2>
    <figure>
        <img src="./midias/grafico.png" alt="Grafico de crescimento anual da empresa" width="300px">
        <figcaption><strong>Grafico de crescimento da empresa em 2025.</strong></figcaption>
    </figure>

    <h2>Áudio:</h2>
    <audio controls>
        <source src="./midias/audio.mp3" type="audio/mpeg">
        Não foi possivel reproduzir o áudio
    </audio>

    <h2>Video:</h2>
    <video controls width="400px">
        <source src="./midias/video.mp4" type="video/mp4">
        não foi possivel reproduzir o video
    </video>

    <h2>Video incorporado do Youtube:</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/E1dW377oqXw?si=nd7LfUbmQv3uDOa6" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h2>Mapas:</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3630.6909639340306!2d-47.84881762373322!3d-24.4961622966015!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94c5338bea658bc1%3A0xdea6f93b5aae61a8!2sFatec%20Registro!5e0!3m2!1spt-BR!2sbr!4v1788217413028!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <h2>Incorporando PDFs:</h2>
    <iframe 
    src="./midias/documento.pdf"
    title="Horario do DSM-1"
    width="600"
    height="350"
    >
    </iframe>
  </body>
</html>
