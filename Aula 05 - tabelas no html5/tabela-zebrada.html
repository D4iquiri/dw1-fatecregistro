<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela Zebrada</title>
    <!-- CSS interno: estilização dentro do próprio HTML. É insirido dentro da tag <head> -->
    <style>
        tr:nth-child(odd){
            background-color: #e8eef1;
        }
        tr:nth-child(even){
            background-color: #c9daee;
        }
        body{
            font-family: "Verdana";
        }

    </style>
  </head>
  <body>
    <!-- Tabela zebrada -->
    <table border="1">
      <thead>
        <tr>
          <th colspan="6">
            <h3>Tabela de Clientes</h3>
          </th>
        </tr>
        <tr>
          <th scope="col" colspan="3">Dados Pessoais:</th>
          <th scope="col" colspan="2">Endereço:</th>
          <th scope="col" colspan="1">Contato:</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <!-- Dados pessoais -->
          <th scope="col">Nome:</th>
          <th scope="col">Idade:</th>
          <th scope="col">Profissão</th>
          <!-- Endereço -->
          <th scope="col">Rua:</th>
          <th scope="col">Cidade:</th>
          <!-- Contato -->
           <th scope="col">E-mail:</th>
        </tr>
        <tr>
            <td>Ana Souza Pereira</td>
            <td>25</td>
            <td>Engenheira</td>
            <td>Avenida A.</td>
            <td>São Paulo</td>
            <td>ana.pereira@gmail.com</td>
        </tr>
        <tr>
            <td>João ricardo das Neves</td>
            <td>30</td>
            <td>Advogado</td>
            <td>Avenida B.</td>
            <td>Rio De Janeiro</td>
            <td>joao.neve@gmail.com</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
