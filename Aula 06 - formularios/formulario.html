<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de cadastro de aluno - Curso DSM</title>
  </head>
  <body>
    <h1>Cadastro de Aluno - DSM</h1>
    <p>Preencha o formulario com suas informações para cadastrar no sistema</p>

    <form action="#" method="POST">
      <fieldset>
        <legend>Dados Pessoais</legend>

        <label for="nome">Nome Completo:</label> <br />
        <input
          type="text"
          id="nome"
          required
          placeholder="Insira seu Nome Completo"
        />
        <br><br>

        <label for="email">E-mail:</label> <br />
        <input
          type="email"
          id="email"
          required
          placeholder="Insira seu E-mail"
        />
        <br><br>

        <label for="idade">Data de nascimento:</label><br />
        <input type="date" id="idade" />
      </fieldset>

      <fieldset>
        <legend>Dados Acadêmicos</legend>
        <label for="Curso">Curso:</label>
        <select name="curso" id="curso">
          <option value="1">DSM</option>
          <option value="2">ADS</option>
          <option value="3">Outro</option>
        </select>
        <br><br>

        <label for="periodo">Período:</label>
        <input type="radio" value="manha" name="periodo" id="manha" />
        <label for="manha">Manhã</label>
        <input type="radio" value="noite" name="periodo" id="noite" />
        <label for="noite">Noite</label>
      </fieldset><br>

      <button type="submit">Enviar</button>
      <button type="reset">Limpar</button>
    </form>
  </body>
</html>
